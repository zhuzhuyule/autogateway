services:
  autogateway:
    # 默认拉本项目预 build 的镜像 (multi-arch: linux/amd64 + linux/arm64).
    # docker compose pull && docker compose up -d 即可滚动升级.
    image: ghcr.io/zhuzhuyule/autogateway:latest
    # 每次 `docker compose up -d` 自动拉取最新 latest 镜像 — 无需先手动 pull、无需改 tag。
    # 这是让所有机器"始终跑最新版"的关键:配合 :latest, 一条 up -d 就是滚动升级。
    pull_policy: always
    # 也可改用上游 GPT-Load 官方镜像(不含本项目的免费 Provider/系统聚合等增强):
    # image: ghcr.io/tbphp/gpt-load:latest
    # 想从源码本地 build 时, 把上面 image 行注释掉, 启用以下 build 块:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: autogateway
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    env_file:
      - .env
    # ── 忘记登录密钥(auth_key)时的重置办法,全程不用碰数据库 ──────────────
    # 在 .env 里加一行,然后 `docker compose up -d` 重启一次即可:
    #   RESET_AUTH_KEY=你的新密钥
    # 启动时会把 auth_key(以及默认聚合分组的 proxy_key)重置成这个值,用它登录即可。
    # 一次性生效:同一个值只会重置一次,可以一直留在 .env 里不用删;
    # 想再次重置时,把 RESET_AUTH_KEY 改成新值再重启即可。
    # ──────────────────────────────────────────────────────────────────
    restart: always
    volumes:
      - ./data:/app/data
    stop_grace_period: ${SERVER_GRACEFUL_SHUTDOWN_TIMEOUT:-10}s
    healthcheck:
      test: wget -q --spider -T 10 -O /dev/null http://localhost:${PORT:-3001}/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # depends_on:
    #   mysql:
    #     condition: service_healthy
    #     restart: true
    #   postgres:
    #     condition: service_healthy
    #     restart: true
    #   redis:
    #     condition: service_healthy
    #     restart: true

  # 如果需要安装 MySQL、PostgreSQL 或 Redis，请取消以下注释并配置相应的环境变量。
  # 并且要在上方的depends_on中取消注释相应的依赖服务。

