name: Release

# 触发条件: push 一个 vX.Y.Z 的 tag.
#   git tag v1.1.0 -m "..."
#   git push origin v1.1.0
on:
  push:
    tags:
      - 'v*'

# 需要写仓库 contents 来创建 release, 写 packages 来推 ghcr.io.
permissions:
  contents: write
  packages: write

# Two tags pushed back to back would otherwise race on the `latest` tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build multi-arch image & publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史, 让 release notes 能 diff 上一个 tag

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr 镜像 path 必须全小写; github.repository 含原始大小写, 这里兜底转一下.
      - name: Compute image name (lowercased)
        id: img
        env:
          REPO: ${{ github.repository }}
        run: |
          NAME=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${NAME}" >> "$GITHUB_OUTPUT"
          # metadata-action strips the leading "v", so the published tags are
          # 2.8.0 / 2.8 — not v2.8.0. Everything downstream uses this value.
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # A tag cut from an unmerged branch must not move `latest`: compose files
      # and install scripts pin `latest` with pull_policy=always, so following
      # it would roll every user onto unreleased work.
      - name: Detect release channel
        id: channel
        run: |
          git fetch --no-tags origin +refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}
          if git merge-base --is-ancestor "$GITHUB_REF_NAME" "origin/${DEFAULT_BRANCH}"; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.channel.outputs.latest == 'true' }}

      - name: Build & push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compose release body
        id: body
        env:
          IMAGE: ${{ steps.img.outputs.name }}
          VERSION: ${{ steps.img.outputs.version }}
          LATEST: ${{ steps.channel.outputs.latest }}
        run: |
          {
            echo 'text<<BODY'
            echo 'Multi-arch container image:'
            echo ''
            echo '```bash'
            echo "docker pull ${IMAGE}:${VERSION}"
            if [ "$LATEST" = "true" ]; then echo "docker pull ${IMAGE}:latest"; fi
            echo '```'
            echo 'BODY'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.channel.outputs.latest != 'true' }}
          body: ${{ steps.body.outputs.text }}
