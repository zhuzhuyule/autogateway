name: Release

# 触发条件: push 一个 vX.Y.Z 的 tag.
#   git tag v1.1.0 -m "..."
#   git push origin v1.1.0
on:
  push:
    tags:
      - 'v*'

# 需要写仓库 contents 来创建 release, 写 packages 来推 ghcr.io.
permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build multi-arch image & publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史, 让 release notes 能 diff 上一个 tag

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr 镜像 path 必须全小写; github.repository 含原始大小写, 这里兜底转一下.
      - name: Compute image name (lowercased)
        id: img
        run: |
          NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${NAME}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build & push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            Multi-arch container image:
            ```bash
            docker pull ${{ steps.img.outputs.name }}:${{ github.ref_name }}
            docker pull ${{ steps.img.outputs.name }}:latest
            ```
